// proto/enclave/v1/attestation.proto
// Protocol Buffer Definition for SPDM 1.2 Remote Attestation & Key Exchange
// Author: Kamran Saberifard
// License: Apache 2.0

syntax = "proto3";

package enclave.v1;

option go_package = "github.com/kamisaberi/enclave-ai/proto/v1;enclavev1";

// Hardware Trusted Execution Environment Target
enum HardwareTarget {
  HARDWARE_TARGET_UNSPECIFIED      = 0;
  HARDWARE_TARGET_NVIDIA_HOPPER_H100 = 1;
  HARDWARE_TARGET_NVIDIA_BLACKWELL_B200 = 2;
  HARDWARE_TARGET_AMD_SEV_SNP_GPU  = 3;
  HARDWARE_TARGET_SIMULATED_TEE    = 4;
}

// SPDM 1.2 Attestation Request sent from Client to GPU TEE Node
message AttestationChallenge {
  string challenge_id = 1;
  bytes client_nonce = 2;             // 32-byte cryptographic random nonce
  bytes client_public_key = 3;        // Client ECDH P-256 / Ed25519 public key
  HardwareTarget target_hardware = 4;
  uint32 measurement_mask = 5;       // Bitmask selecting requested SPDM measurement blocks
}

// Reference Integrity Measurement (RIM) profile hash values
message RIMProfile {
  string driver_version = 1;         // e.g., "550.54.14"
  string vbios_version = 2;          // GPU VBIOS version string
  bytes driver_rim_hash = 3;         // SHA-256 hash of official GPU driver
  bytes gsp_firmware_rim_hash = 4;   // SHA-256 hash of NVIDIA GPU Security Processor firmware
  bytes kernel_module_rim_hash = 5;  // SHA-256 hash of nvidia-peermem / nvidia-uvm kernel modules
}

// Signed Attestation Quote generated by the GPU Security Processor (GSP)
message AttestationQuote {
  string challenge_id = 1;
  HardwareTarget target_hardware = 2;
  bytes gsp_nonce = 3;                // 32-byte GSP random nonce
  bytes spdm_measurement_summary = 4; // Concatenated SHA-256 measurement digest
  RIMProfile active_rim_profile = 5;  // Measured RIM profile values
  bytes gsp_signature = 6;            // Cryptographic signature signed by GPU ECC Leaf Key
  bytes gsp_certificate_chain = 7;    // DER-encoded x509 cert chain signed by NVIDIA Root CA
  int64 timestamp_ns = 8;             // Measurement timestamp
}

// Request to perform ECDH key exchange for model weight decryption
message KeyExchangeRequest {
  string challenge_id = 1;
  bytes client_ecdh_public_key = 2;  // Client Ephemeral Public Key (P-256 / X25519)
  AttestationQuote attestation_quote = 3; // Attached signed attestation quote
}

// Response from GPU TEE containing derived key agreement parameters
message KeyExchangeResponse {
  string challenge_id = 1;
  bool attestation_verified = 2;
  bytes enclave_ecdh_public_key = 3; // GPU TEE Ephemeral Public Key
  bytes key_derivation_salt = 4;     // HKDF salt parameter
  string error_message = 5;
}

// Encrypted Tensor payload wrapper
message EncryptedTensorPayload {
  string model_id = 1;
  bytes initialization_vector = 2;   // 12-byte AES-GCM IV / Nonce
  bytes cipher_text = 3;             // Encrypted tensor data
  bytes authentication_tag = 4;      // 16-byte AES-GCM Auth Tag
  int64 original_bytes = 5;
}